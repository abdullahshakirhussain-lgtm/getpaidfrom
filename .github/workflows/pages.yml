name: Build and deploy site

# Builds and tests the static site, then deploys it:
# - to Cloudflare (Workers static assets, see wrangler.toml) when the CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID repository secrets are set;
# - otherwise to GitHub Pages, as before.
# Set the SITE_URL repository variable to the public address (workers.dev or your own domain).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.target.outputs.cloudflare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Jinja2==3.1.6 MarkupSafe==3.0.4
      - run: python tests/test_build_site.py
      - name: Build
        run: python scripts/build_site.py
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://abdullahshakirhussain-lgtm.github.io/getpaidfrom' }}
      - run: python tests/test_site_links.py
      - id: target
        name: Choose host
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "cloudflare=true" >> "$GITHUB_OUTPUT"; else echo "cloudflare=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare
        if: steps.target.outputs.cloudflare == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - if: steps.target.outputs.cloudflare != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.cloudflare != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
