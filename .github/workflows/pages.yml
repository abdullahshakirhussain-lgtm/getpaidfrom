name: Build and deploy site

# Builds and tests the static site, then deploys it:
# - to Cloudflare (Workers static assets, see wrangler.toml) when the CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID repository secrets are set;
# - otherwise to GitHub Pages, as before.
# Set the SITE_URL repository variable to the public address (workers.dev or your own domain).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.target.outputs.cloudflare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Jinja2==3.1.6 MarkupSafe==3.0.4
      - run: python tests/test_build_site.py
      - run: python tests/test_i18n.py
        env:
          PYTHONIOENCODING: utf-8
      - id: target
        name: Choose host
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "cloudflare=true" >> "$GITHUB_OUTPUT"; else echo "cloudflare=false" >> "$GITHUB_OUTPUT"; fi
      # canonical links, sitemap and robots.txt must name the host the site is really served from
      - name: Build
        run: python scripts/build_site.py
        env:
          SITE_URL: ${{ vars.SITE_URL || (steps.target.outputs.cloudflare == 'true' && 'https://getpaidfrom.getpaidfrom.workers.dev' || 'https://abdullahshakirhussain-lgtm.github.io/getpaidfrom') }}
      - run: python tests/test_site_links.py
      - name: Find or create the sign-ups KV namespace
        if: steps.target.outputs.cloudflare == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ensure_kv.py
      - name: Keep the live sitemap (to see which pages changed)
        if: steps.target.outputs.cloudflare == 'true'
        run: curl -sf "${{ vars.SITE_URL || 'https://getpaidfrom.getpaidfrom.workers.dev' }}/sitemap.xml" -o /tmp/old-sitemap.xml || true
      - name: Deploy to Cloudflare
        if: steps.target.outputs.cloudflare == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Tell IndexNow which pages changed
        if: steps.target.outputs.cloudflare == 'true' && vars.SITE_URL != ''
        run: python scripts/indexnow.py /tmp/old-sitemap.xml site/dist/sitemap.xml
      - if: steps.target.outputs.cloudflare != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.cloudflare != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
