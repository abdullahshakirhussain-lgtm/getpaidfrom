# Cloudflare Worker + static assets: worker/index.js handles /api/* (email alerts) and counts page views;
# everything else is the built site in site/dist. Deployed by .github/workflows/pages.yml once the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
name = "getpaidfrom"
main = "worker/index.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./site/dist/"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker only for the API, HTML pages (paths ending in "/") and language folders (for their not-found page);
# fonts, CSS and JS stay plain static assets.
run_worker_first = ["/api/*", "/", "/*/", "/es/*", "/fr/*", "/pt/*", "/ar/*", "/ur/*", "/bn/*", "/id/*", "/vi/*"]

# Email alert sign-ups. scripts/ensure_kv.py finds or creates the namespace in CI and fills in the id before deploy.
[[kv_namespaces]]
binding = "SIGNUPS"
id = "SIGNUPS_KV_ID"

# Page views per page and visitor country (no cookies, no IP addresses). Created on first write.
# Off until Analytics Engine is enabled for the account (Cloudflare dashboard > Workers > Analytics Engine);
# deploys fail with code 10089 otherwise. The Worker skips counting while the binding is missing.
# [[analytics_engine_datasets]]
# binding = "VIEWS"
# dataset = "getpaidfrom_views"
