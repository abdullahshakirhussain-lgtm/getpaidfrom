# Cloudflare Workers static-assets site (no Worker script): serves the built site/dist folder.
# Deployed by .github/workflows/pages.yml once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
name = "getpaidfrom"
compatibility_date = "2026-10-27"

[assets]
directory = "./site/dist/"
not_found_handling = "404-page"
